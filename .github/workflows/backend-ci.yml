name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install poetry==2.1.1

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --with database,security,dev --no-interaction --no-ansi

      - name: Lint backend
        working-directory: backend
        run: poetry run ruff check app tests

      - name: Test backend
        working-directory: backend
        run: poetry run pytest --cov=app --cov-report=term-missing --cov-fail-under=85